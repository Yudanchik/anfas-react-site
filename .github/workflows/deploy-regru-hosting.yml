name: Deploy to REG.RU Hosting

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regru-hosting-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

      - name: Build static site
        run: PUBLIC_PATH=/ pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: build/client
          if-no-files-found: error

  deploy-prod:
    name: deploy production
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    environment: production

    env:
      FTP_SERVER: ${{ secrets.REG_RU_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.REG_RU_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ secrets.REG_RU_FTP_PROTOCOL }}
      SERVER_DIR: ${{ secrets.REG_RU_PROD_DIR }}

    steps:
      - name: Check FTP secrets
        id: secrets
        shell: bash
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$SERVER_DIR" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production FTP secrets are not configured yet. Build artifact was created, deploy is skipped."
          fi

      - name: Download build artifact
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: build/client

      - name: Normalize server directory
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          normalized="${SERVER_DIR%/}/"
          echo "SERVER_DIR=$normalized" >> "$GITHUB_ENV"

      - name: Deploy production via FTP
        if: steps.secrets.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL || 'ftp' }}
          local-dir: build/client/
          server-dir: ${{ env.SERVER_DIR }}

  deploy-dev:
    name: deploy development
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.ref == 'refs/heads/dev'
    environment: development

    env:
      FTP_SERVER: ${{ secrets.REG_RU_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.REG_RU_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ secrets.REG_RU_FTP_PROTOCOL }}
      SERVER_DIR: ${{ secrets.REG_RU_DEV_DIR }}

    steps:
      - name: Check FTP secrets
        id: secrets
        shell: bash
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$SERVER_DIR" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Development FTP secrets are not configured yet. Build artifact was created, deploy is skipped."
          fi

      - name: Download build artifact
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: build/client

      - name: Block search indexing on development
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          printf '%s\n' \
            'User-agent: *' \
            'Disallow: /' \
            '' \
            'Host: https://dev.anfas-remont.ru' \
            > build/client/robots.txt

      - name: Normalize server directory
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          normalized="${SERVER_DIR%/}/"
          echo "SERVER_DIR=$normalized" >> "$GITHUB_ENV"

      - name: Deploy development via FTP
        if: steps.secrets.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL || 'ftp' }}
          local-dir: build/client/
          server-dir: ${{ env.SERVER_DIR }}
