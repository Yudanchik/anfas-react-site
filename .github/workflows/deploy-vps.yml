name: Deploy to VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image: ${{ steps.meta.outputs.image }}
      environment: ${{ steps.target.outputs.environment }}
      compose_dir: ${{ steps.target.outputs.compose_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/anfas/prod" >> "$GITHUB_OUTPUT"
            echo "branch_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/anfas/dev" >> "$GITHUB_OUTPUT"
            echo "branch_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tag="${{ steps.target.outputs.branch_tag }}"
          sha_tag="${GITHUB_SHA::12}"

          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${tag}"
            echo "${image}:${sha_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_PATH=/
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to ${{ needs.docker.outputs.environment }}
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 10
    environment: ${{ needs.docker.outputs.environment }}

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      DEPLOY_IMAGE: ${{ needs.docker.outputs.image }}
      COMPOSE_DIR: ${{ needs.docker.outputs.compose_dir }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}

    steps:
      - name: Check VPS secrets
        id: secrets
        shell: bash
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets are not configured yet. Docker image was published, SSH deploy is skipped."
          fi

      - name: Configure SSH
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull image and restart service
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "cd '$COMPOSE_DIR' && \
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
             DEPLOY_IMAGE='$DEPLOY_IMAGE' docker compose pull && \
             DEPLOY_IMAGE='$DEPLOY_IMAGE' docker compose up -d && \
             docker image prune -f"
